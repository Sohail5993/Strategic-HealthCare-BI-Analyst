<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1400" height="900" fill="#f4f5f7"/>
  <text x="30" y="35" font-size="22" font-weight="700" fill="#1f2937">Denial Management &amp; Clean Claim Rate — Executive View</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">Trailing 18 months · Payer / Service Line / Facility filters applied above</text>

  <!-- Filter bar -->
  <rect x="30" y="75" width="1340" height="34" rx="6" fill="#e5e7eb"/>
  <text x="45" y="97" font-size="12" fill="#374151">Filters:  Date Range ▾    Payer ▾    Service Line ▾    Facility ▾</text>

  <!-- KPI scorecard row -->
  <g>
    <rect x="30" y="125" width="320" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="50" y="160" font-size="34" font-weight="700" fill="#dc2626">15.5%</text>
    <text x="50" y="182" font-size="13" fill="#6b7280">Denial Rate</text>
  </g>
  <g>
    <rect x="365" y="125" width="320" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="385" y="160" font-size="34" font-weight="700" fill="#dc2626">84.5%</text>
    <text x="385" y="182" font-size="13" fill="#6b7280">Clean Claim Rate (target: 90–95%)</text>
  </g>
  <g>
    <rect x="700" y="125" width="320" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="720" y="160" font-size="34" font-weight="700" fill="#1f2937">52.0%</text>
    <text x="720" y="182" font-size="13" fill="#6b7280">Gross Collection Rate</text>
  </g>
  <g>
    <rect x="1035" y="125" width="335" height="110" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="1055" y="160" font-size="34" font-weight="700" fill="#1f2937">24.6d</text>
    <text x="1055" y="182" font-size="13" fill="#6b7280">Avg Turnaround Time</text>
  </g>

  <!-- Row 2: trend + pareto -->
  <g>
    <rect x="30" y="255" width="655" height="220" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="50" y="280" font-size="14" font-weight="600" fill="#1f2937">Denial Rate Trend by Month</text>
    <polyline points="60,440 130,420 200,435 270,410 340,430 410,405 480,455 550,460 620,465 660,468"
              fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="60" y1="400" x2="660" y2="400" stroke="#9ca3af" stroke-dasharray="4,3"/>
    <text x="600" y="395" font-size="10" fill="#9ca3af">10% target</text>
  </g>
  <g>
    <rect x="705" y="255" width="665" height="220" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="725" y="280" font-size="14" font-weight="600" fill="#1f2937">Denial Reason Pareto (80/20)</text>
    <rect x="740" y="330" width="40" height="120" fill="#f97316"/>
    <rect x="800" y="345" width="40" height="105" fill="#f97316"/>
    <rect x="860" y="365" width="40" height="85" fill="#fb923c"/>
    <rect x="920" y="385" width="40" height="65" fill="#fdba74"/>
    <rect x="980" y="400" width="40" height="50" fill="#fed7aa"/>
    <rect x="1040" y="412" width="40" height="38" fill="#ffedd5"/>
    <polyline points="760,340 820,320 880,300 940,290 1000,284 1060,280"
              fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="1090" y="285" font-size="10" fill="#1f2937">cum. %</text>
  </g>

  <!-- Row 3: bar by payer + heatmap -->
  <g>
    <rect x="30" y="490" width="440" height="220" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="50" y="515" font-size="14" font-weight="600" fill="#1f2937">Denial Rate by Payer</text>
    <rect x="150" y="535" width="230" height="16" fill="#dc2626"/>
    <rect x="150" y="558" width="205" height="16" fill="#dc2626"/>
    <rect x="150" y="581" width="180" height="16" fill="#ef4444"/>
    <rect x="150" y="604" width="120" height="16" fill="#f87171"/>
    <rect x="150" y="627" width="110" height="16" fill="#fca5a5"/>
    <rect x="150" y="650" width="105" height="16" fill="#fca5a5"/>
    <rect x="150" y="673" width="100" height="16" fill="#fecaca"/>
    <text x="55" y="547" font-size="10" fill="#374151">Self-Pay</text>
    <text x="55" y="570" font-size="10" fill="#374151">Medicaid</text>
    <text x="55" y="593" font-size="10" fill="#374151">Meridian</text>
  </g>
  <g>
    <rect x="480" y="490" width="890" height="220" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="500" y="515" font-size="14" font-weight="600" fill="#1f2937">Payer × Service Line Denial Rate Heatmap</text>
    <!-- grid of heat cells -->
    <g font-size="9">
      <!-- generate a simple 8x6 grid -->
      <rect x="620" y="535" width="38" height="24" fill="#fee2e2"/>
      <rect x="660" y="535" width="38" height="24" fill="#fecaca"/>
      <rect x="700" y="535" width="38" height="24" fill="#dc2626"/>
      <rect x="740" y="535" width="38" height="24" fill="#fca5a5"/>
      <rect x="780" y="535" width="38" height="24" fill="#fee2e2"/>
      <rect x="820" y="535" width="38" height="24" fill="#fecaca"/>
      <rect x="860" y="535" width="38" height="24" fill="#fee2e2"/>
      <rect x="900" y="535" width="38" height="24" fill="#dc2626"/>
      <rect x="620" y="561" width="38" height="24" fill="#fecaca"/>
      <rect x="660" y="561" width="38" height="24" fill="#fee2e2"/>
      <rect x="700" y="561" width="38" height="24" fill="#b91c1c"/>
      <rect x="740" y="561" width="38" height="24" fill="#fecaca"/>
      <rect x="780" y="561" width="38" height="24" fill="#fee2e2"/>
      <rect x="820" y="561" width="38" height="24" fill="#fee2e2"/>
      <rect x="860" y="561" width="38" height="24" fill="#fecaca"/>
      <rect x="900" y="561" width="38" height="24" fill="#fecaca"/>
    </g>
    <text x="700" y="600" font-size="10" fill="#6b7280">(darker = higher denial rate — Meridian × Oncology/Ortho stands out)</text>
  </g>

  <!-- Row 4: root cause + facility -->
  <g>
    <rect x="30" y="725" width="655" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="50" y="750" font-size="14" font-weight="600" fill="#1f2937">Root Cause: Meridian Prior-Auth Policy Change</text>
    <rect x="150" y="800" width="60" height="40" fill="#93c5fd"/>
    <rect x="300" y="770" width="60" height="70" fill="#dc2626"/>
    <text x="140" y="855" font-size="10" fill="#374151">Before (21%)</text>
    <text x="290" y="855" font-size="10" fill="#374151">After Jan 2025 (56%)</text>
  </g>
  <g>
    <rect x="705" y="725" width="665" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="725" y="750" font-size="14" font-weight="600" fill="#1f2937">Facility Eligibility Gap (% of denials that are Eligibility)</text>
    <rect x="900" y="800" width="120" height="16" fill="#dc2626"/>
    <rect x="900" y="822" width="70" height="16" fill="#f87171"/>
    <rect x="900" y="844" width="55" height="16" fill="#fca5a5"/>
    <text x="740" y="812" font-size="10" fill="#374151">East Medical Center — 46%</text>
    <text x="740" y="834" font-size="10" fill="#374151">Main Campus — 21%</text>
  </g>
</svg>
